name: Desktop app

# Compila la app de escritorio (desktop/) en Windows y macOS. El instalable de
# Windows no se puede generar desde macOS, así que este workflow es el camino.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Tests del motor
        working-directory: desktop
        run: cargo test

      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: firemd-sync-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app
