<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- iOS ignores the manifest icons and wants an opaque touch icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Markdown notes with folders, tags and real-time collaborative editing. Import your Obsidian vault."
    />
    <title>FireMD: Markdown notes</title>
    <!-- Canonical host is the apex domain: www.firemd.app and the legacy
         md-sync-app.web.app serve the same app, so point crawlers and
         previews at one URL. -->
    <link rel="canonical" href="https://firemd.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://firemd.app/" />
    <meta property="og:title" content="FireMD: Markdown notes" />
    <meta
      property="og:description"
      content="Markdown notes with folders, tags and real-time collaborative editing. Import your Obsidian vault."
    />
    <meta property="og:image" content="https://firemd.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FireMD: collaborative Markdown notes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://firemd.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
