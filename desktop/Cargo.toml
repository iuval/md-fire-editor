[package]
name = "firemd-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Sincronización de dos vías entre FireMD y una carpeta local"
license = "MIT"

[lib]
name = "firemd_desktop"
path = "src/lib.rs"

[[bin]]
name = "firemd-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
